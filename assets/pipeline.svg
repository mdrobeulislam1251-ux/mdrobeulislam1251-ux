<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="box" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1c2333"/>
      <stop offset="1" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#3D7DFF"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .ttl { fill: #e6edf3; font-size: 20px; font-weight: 700; }
      .sub { fill: #8b949e; font-size: 12px; }
      .st  { fill: #e6edf3; font-size: 14px; font-weight: 600; }
      .sd  { fill: #8b949e; font-size: 11px; }
      .gate { fill: #f87171; font-size: 10px; font-weight: 700; letter-spacing: .5px; }
    </style>
  </defs>
  <rect width="900" height="190" rx="16" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="899" height="189" rx="16" fill="none" stroke="#30363d"/>
  <text x="32" y="40" class="ttl">The outbound data pipeline I own end to end</text>
  <text x="32" y="60" class="sub">Raw ICP in, booked meetings out. Every stage is a gate: a record moves only when the previous stage proved it.</text>

  <!-- rail -->
  <path id="rail" d="M80 125 H820" stroke="#21262d" stroke-width="3" fill="none"/>
  <path d="M80 125 H820" stroke="url(#edge)" stroke-width="3" fill="none" stroke-dasharray="6 10" opacity=".55">
    <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- stages -->
  <g>
    <rect x="40" y="96" width="120" height="58" rx="12" fill="url(#box)" stroke="#30363d"/>
    <text class="st" x="100" y="121" text-anchor="middle">ICP</text>
    <text class="sd" x="100" y="139" text-anchor="middle">customer rules</text>
  </g>
  <g>
    <rect x="200" y="96" width="120" height="58" rx="12" fill="url(#box)" stroke="#30363d"/>
    <text class="st" x="260" y="121" text-anchor="middle">Extract</text>
    <text class="sd" x="260" y="139" text-anchor="middle">Apollo, at scale</text>
  </g>
  <g>
    <rect x="360" y="96" width="120" height="58" rx="12" fill="url(#box)" stroke="#30363d"/>
    <text class="st" x="420" y="121" text-anchor="middle">Verify</text>
    <text class="sd" x="420" y="139" text-anchor="middle">waterfall, source tracked</text>
  </g>
  <g>
    <rect x="520" y="96" width="120" height="58" rx="12" fill="url(#box)" stroke="#30363d"/>
    <text class="st" x="580" y="121" text-anchor="middle">Resolve</text>
    <text class="sd" x="580" y="139" text-anchor="middle">decision-maker, dedupe</text>
  </g>
  <g>
    <rect x="680" y="96" width="120" height="58" rx="12" fill="url(#box)" stroke="#30363d"/>
    <text class="st" x="740" y="121" text-anchor="middle">Deliver</text>
    <text class="sd" x="740" y="139" text-anchor="middle">webhook, API, CRM</text>
  </g>

  <!-- gates between stages -->
  <g>
    <text class="gate" x="180" y="88" text-anchor="middle">GATE</text>
    <text class="gate" x="340" y="88" text-anchor="middle">GATE</text>
    <text class="gate" x="500" y="88" text-anchor="middle">GATE</text>
    <text class="gate" x="660" y="88" text-anchor="middle">GATE</text>
  </g>

  <!-- moving records -->
  <circle r="5" fill="#A78BFA" filter="url(#g)">
    <animateMotion dur="5s" repeatCount="indefinite" calcMode="linear"><mpath href="#rail"/></animateMotion>
  </circle>
  <circle r="5" fill="#60A5FA" filter="url(#g)">
    <animateMotion dur="5s" begin="1.6s" repeatCount="indefinite" calcMode="linear"><mpath href="#rail"/></animateMotion>
  </circle>
  <circle r="5" fill="#C4B5FD" filter="url(#g)">
    <animateMotion dur="5s" begin="3.2s" repeatCount="indefinite" calcMode="linear"><mpath href="#rail"/></animateMotion>
  </circle>
  <!-- a rejected record drops at the verify gate -->
  <circle r="5" fill="#f87171" filter="url(#g)">
    <animateMotion dur="5s" begin="0.8s" repeatCount="indefinite" calcMode="linear" path="M80 125 H340 V175"/>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.7;0.75" dur="5s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <text class="sd" x="850" y="129" text-anchor="start" fill="#8b949e">→ meetings</text>
</svg>
