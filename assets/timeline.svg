<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="line" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#3D7DFF"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <style>
      .ttl { fill: #e6edf3; font-size: 22px; font-weight: 700; }
      .sub { fill: #8b949e; font-size: 12px; }
      .yr  { fill: #a78bfa; font-size: 13px; font-weight: 700; }
      .role { fill: #e6edf3; font-size: 14px; font-weight: 600; }
      .org { fill: #8b949e; font-size: 12px; }
      .node { opacity: 0; animation: pop 0.5s cubic-bezier(.2,.9,.3,1.3) forwards; }
      .n1 { animation-delay: 0.6s } .n2 { animation-delay: 1.0s } .n3 { animation-delay: 1.4s } .n4 { animation-delay: 1.8s } .n5 { animation-delay: 2.2s }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes pulse { 0%,100% { opacity: .25; transform: scale(1); } 50% { opacity: 0; transform: scale(2.2); } }
      .draw { stroke-dasharray: 760; stroke-dashoffset: 760; animation: draw 2.2s ease-out forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
    </style>
  </defs>
  <rect width="900" height="300" rx="16" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="899" height="299" rx="16" fill="none" stroke="#30363d"/>
  <text x="32" y="44" class="ttl">Experience</text>
  <text x="32" y="66" class="sub">Two US lead-generation companies, one founded company, and the tooling built around them.</text>

  <line x1="70" y1="160" x2="830" y2="160" stroke="#21262d" stroke-width="4" stroke-linecap="round"/>
  <line class="draw" x1="70" y1="160" x2="830" y2="160" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>

  <!-- Aug 2024: Trusted Leads -->
  <g class="node n1">
    <circle class="pulse" cx="120" cy="160" r="10" fill="#3D7DFF"/>
    <circle cx="120" cy="160" r="8" fill="#0d1117" stroke="#3D7DFF" stroke-width="3"/>
    <text class="yr" x="120" y="128" text-anchor="middle">Aug 2024 →</text>
    <text class="role" x="120" y="196" text-anchor="middle">Head Data Engineer</text>
    <text class="org" x="120" y="214" text-anchor="middle">Trusted Leads · full-time, remote</text>
  </g>

  <!-- Aug 2024: Lead Gen Jay -->
  <g class="node n2">
    <circle class="pulse" cx="300" cy="160" r="10" fill="#5B5BF5"/>
    <circle cx="300" cy="160" r="8" fill="#0d1117" stroke="#5B5BF5" stroke-width="3"/>
    <text class="yr" x="300" y="128" text-anchor="middle">Aug 2024 →</text>
    <text class="role" x="300" y="196" text-anchor="middle">Senior Data Engineer</text>
    <text class="org" x="300" y="214" text-anchor="middle">Lead Gen Jay · contract, remote</text>
  </g>

  <!-- 2025: Apollo orchestrator -->
  <g class="node n3">
    <circle class="pulse" cx="480" cy="160" r="10" fill="#6D4AEF"/>
    <circle cx="480" cy="160" r="8" fill="#0d1117" stroke="#6D4AEF" stroke-width="3"/>
    <text class="yr" x="480" y="128" text-anchor="middle">2025</text>
    <text class="role" x="480" y="196" text-anchor="middle">Distributed scraping orchestrator</text>
    <text class="org" x="480" y="214" text-anchor="middle">7 n8n workflows, versioned job state</text>
  </g>

  <!-- 2026: Outboundrix LLC -->
  <g class="node n4">
    <circle class="pulse" cx="660" cy="160" r="10" fill="#7C3AED"/>
    <circle cx="660" cy="160" r="8" fill="#0d1117" stroke="#7C3AED" stroke-width="3"/>
    <text class="yr" x="660" y="128" text-anchor="middle">2026 →</text>
    <text class="role" x="660" y="196" text-anchor="middle">Founder</text>
    <text class="org" x="660" y="214" text-anchor="middle">Outboundrix LLC · Wyoming, US</text>
  </g>

  <!-- 2026: T-Ex LLM / verification-gated agents -->
  <g class="node n5">
    <circle class="pulse" cx="800" cy="160" r="10" fill="#A78BFA"/>
    <circle cx="800" cy="160" r="8" fill="#0d1117" stroke="#A78BFA" stroke-width="3"/>
    <text class="yr" x="800" y="128" text-anchor="middle">2026 →</text>
    <text class="role" x="800" y="196" text-anchor="middle">Verification-gated agents</text>
    <text class="org" x="800" y="214" text-anchor="middle">T-Ex LLM Runpack · own project</text>
  </g>

  <text class="sub" x="868" y="268" text-anchor="end">Bogura, Bangladesh · remote on US hours · Bengali, English</text>
</svg>
