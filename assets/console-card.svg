<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Open Robeul Console, a live Refine app">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1222"/><stop offset="1" stop-color="#070b16"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.55"><stop offset="0" stop-color="#A78BFA" stop-opacity="0.22"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
    <style>
      text { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; }
      .blink { animation: b 1.2s steps(1) infinite; } @keyframes b { 50% { opacity: 0; } }
      .pulse { animation: p 2s ease-out infinite; transform-origin: 64px 58px; } @keyframes p { 0% { opacity: .7; r: 5; } 100% { opacity: 0; r: 14; } }
      .row { opacity: 0; animation: in .5s ease forwards; } @keyframes in { to { opacity: 1; } }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="318" rx="22" fill="url(#bg)" stroke="#1e2a44" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="318" rx="22" fill="url(#glow)"/>

  <circle cx="64" cy="58" r="5" fill="#34d399"/><circle class="pulse" cx="64" cy="58" r="5" fill="#34d399"/>
  <text x="80" y="63" font-size="14" font-weight="700" letter-spacing="2" fill="#A78BFA">WELCOME · LIVE CONSOLE</text>
  <text x="56" y="118" font-size="40" font-weight="800" fill="#e6ecf8">Step inside the console.</text>
  <text x="56" y="156" font-size="18" fill="#8b9ab8">Case files told as short documentaries, the pipeline stage by stage,</text>
  <text x="56" y="182" font-size="18" fill="#8b9ab8">and the rules every agent follows. A full SaaS view, built with Refine.</text>
  <rect x="56" y="214" width="268" height="52" rx="12" fill="url(#ac)"/>
  <text x="80" y="247" font-size="18" font-weight="700" fill="#fff">Open Robeul Console  →</text>
  <text x="344" y="247" font-size="14" fill="#5b6b88" class="mono">refine · react · ctrl+k</text>

  <g transform="translate(760 34)">
    <rect width="400" height="252" rx="14" fill="#0f172a" stroke="#1e2a44"/>
    <rect width="400" height="34" rx="14" fill="#111c33"/><rect y="20" width="400" height="14" fill="#111c33"/>
    <circle cx="18" cy="17" r="5" fill="#1e2a44"/><circle cx="34" cy="17" r="5" fill="#1e2a44"/><circle cx="50" cy="17" r="5" fill="#1e2a44"/>
    <text x="70" y="22" font-size="12" fill="#8b9ab8" class="mono">verify.log</text>
    <rect x="284" y="9" width="104" height="17" rx="8.5" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".4"/>
    <text x="336" y="21.5" text-anchor="middle" font-size="10.5" fill="#34d399">all checks green</text>
    <g class="mono" font-size="12.5">
      <g class="row" style="animation-delay:.2s"><text x="20" y="64" fill="#34d399">$</text><text x="40" y="64" fill="#e6ecf8">claim issue</text><text x="380" y="64" fill="#8b9ab8" text-anchor="end">edits unlocked</text></g>
      <g class="row" style="animation-delay:.8s"><text x="20" y="92" fill="#34d399">✓</text><text x="40" y="92" fill="#e6ecf8">typecheck · drift · contract</text><text x="380" y="92" fill="#8b9ab8" text-anchor="end">pass</text></g>
      <g class="row" style="animation-delay:1.4s"><text x="20" y="120" fill="#34d399">✓</text><text x="40" y="120" fill="#e6ecf8">waterfall verify</text><text x="380" y="120" fill="#8b9ab8" text-anchor="end">source tracked</text></g>
      <g class="row" style="animation-delay:2s"><text x="20" y="148" fill="#34d399">✓</text><text x="40" y="148" fill="#e6ecf8">reviewer model</text><text x="380" y="148" fill="#8b9ab8" text-anchor="end">approved</text></g>
      <g class="row" style="animation-delay:2.6s"><text x="20" y="176" fill="#34d399">●</text><text x="40" y="176" fill="#34d399">observed passing · done</text><text x="230" y="176" fill="#A78BFA" class="blink">▍</text></g>
    </g>
    <g font-size="11" fill="#8b9ab8">
      <rect x="20" y="196" width="84" height="40" rx="8" fill="#111c33"/><text x="30" y="214" font-size="15" font-weight="800" fill="#e6ecf8">17.4M</text><text x="30" y="229">contacts</text>
      <rect x="114" y="196" width="84" height="40" rx="8" fill="#111c33"/><text x="124" y="214" font-size="15" font-weight="800" fill="#e6ecf8">69</text><text x="124" y="229">filters</text>
      <rect x="208" y="196" width="84" height="40" rx="8" fill="#111c33"/><text x="218" y="214" font-size="15" font-weight="800" fill="#e6ecf8">53</text><text x="218" y="229">agents</text>
      <rect x="302" y="196" width="78" height="40" rx="8" fill="#111c33"/><text x="312" y="214" font-size="15" font-weight="800" fill="#e6ecf8">571</text><text x="312" y="229">audited</text>
    </g>
  </g>
</svg>
