<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#101a3a"/>
      <stop offset="1" stop-color="#1a1033"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.5" stop-color="#3D7DFF"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#3D7DFF"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="name" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#dbe4ff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#3D7DFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#3D7DFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="260" rx="18"/></clipPath>
    <style>
      .name { font-size: 58px; font-weight: 800; letter-spacing: -1px; fill: url(#name); }
      .title { font-size: 21px; font-weight: 500; fill: #c9d1d9; letter-spacing: 0.5px; }
      .tag { font-size: 13px; font-weight: 600; fill: #a78bfa; letter-spacing: 2.5px; }
      .orb { animation: drift 9s ease-in-out infinite alternate; }
      .orb2 { animation-delay: -4s; }
      @keyframes drift { from { transform: translate(0,0); } to { transform: translate(60px,-20px); } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#grid)"/>

    <circle class="orb" cx="260" cy="60" r="150" fill="url(#glow)" filter="url(#soft)"/>
    <circle class="orb orb2" cx="980" cy="210" r="170" fill="url(#glow)" filter="url(#soft)"/>

    <path fill="url(#wave1)" opacity="0.55">
      <animate attributeName="d" dur="14s" repeatCount="indefinite" calcMode="spline"
        keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"
        values="M0 190 C 200 150, 400 230, 600 190 S 1000 150, 1200 200 L1200 260 L0 260 Z;
                M0 210 C 200 180, 400 160, 600 210 S 1000 230, 1200 180 L1200 260 L0 260 Z;
                M0 190 C 200 150, 400 230, 600 190 S 1000 150, 1200 200 L1200 260 L0 260 Z"/>
    </path>
    <path fill="url(#wave2)" opacity="0.45">
      <animate attributeName="d" dur="11s" repeatCount="indefinite" calcMode="spline"
        keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"
        values="M0 225 C 250 200, 450 250, 650 215 S 1000 195, 1200 230 L1200 260 L0 260 Z;
                M0 205 C 250 240, 450 205, 650 235 S 1000 245, 1200 205 L1200 260 L0 260 Z;
                M0 225 C 250 200, 450 250, 650 215 S 1000 195, 1200 230 L1200 260 L0 260 Z"/>
    </path>

    <g fill="#A78BFA">
      <circle r="3" cx="150" cy="200"><animate attributeName="cy" values="200;186;200" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".4;1;.4" dur="5s" repeatCount="indefinite"/></circle>
      <circle r="2.5" cx="420" cy="215"><animate attributeName="cy" values="215;203;215" dur="6s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".3;.9;.3" dur="6s" begin="-2s" repeatCount="indefinite"/></circle>
      <circle r="3.5" cx="760" cy="195"><animate attributeName="cy" values="195;181;195" dur="7s" begin="-1s" repeatCount="indefinite"/><animate attributeName="opacity" values=".4;1;.4" dur="7s" begin="-1s" repeatCount="indefinite"/></circle>
      <circle r="2.5" cx="1040" cy="210"><animate attributeName="cy" values="210;198;210" dur="5.5s" begin="-3s" repeatCount="indefinite"/><animate attributeName="opacity" values=".3;.9;.3" dur="5.5s" begin="-3s" repeatCount="indefinite"/></circle>
    </g>

    <text class="tag" x="600" y="72" text-anchor="middle">GTM DATA SYSTEMS  ·  AGENT INFRASTRUCTURE  ·  SELF-HOSTED OPS<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.143;1" dur="1.05s" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1"/></text>
    <text class="name" x="600" y="132" text-anchor="middle">MD Robeul Islam<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.333;1" dur="1.35s" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1"/></text>
    <rect x="420" y="148" width="360" height="2" fill="url(#rule)"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.455;1" dur="1.65s" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1"/></rect>
    <text class="title" x="600" y="180" text-anchor="middle">AI-Native Data &amp; Automation Engineer<tspan fill="#A78BFA">_<animate attributeName="opacity" values="1;0" dur="1.1s" begin="1.9s" repeatCount="indefinite" calcMode="discrete"/></tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.526;1" dur="1.9s" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1"/></text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="18" fill="none" stroke="#30363d"/>
</svg>
