<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="535" viewBox="0 0 1200 535" font-family="Geist, Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="The dev loop and its six guarantees"><defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0ba5d8"/><stop offset=".5" stop-color="#3451e0"/><stop offset="1" stop-color="#7a4bf0"/></linearGradient>
  <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2eaf6"/><stop offset=".6" stop-color="#edf0fb"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  <radialGradient id="cloud"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0b1220" flood-opacity=".12"/></filter>
  <filter id="sh2" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b1220" flood-opacity=".06"/></filter>
  <style>
    .pulse { animation: p 2.2s ease-out infinite; } @keyframes p { 0% { opacity: .55; r: 4px; } 100% { opacity: 0; r: 11px; } }
    .row { opacity: 0; animation: in .5s ease forwards; } @keyframes in { to { opacity: 1; } }
  </style>
</defs><rect x=".5" y=".5" width="1199" height="534" rx="16" fill="#ffffff" stroke="#e7e8ec"/><path d="M.5 16.5 a16 16 0 0 1 16 -16 h1167 a16 16 0 0 1 16 16 v32 h-1199 z" fill="#fafafb"/><line x1=".5" y1="48.5" x2="1199.5" y2="48.5" stroke="#e7e8ec"/><text x="24" y="30" font-size="14" fill="#0b1220" font-weight="600">Dev loop</text><text x="1176" y="30" font-size="12" fill="#6b7280" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="end">6 guarantees · 5 review gates</text><line x1="45" y1="98" x2="45" y2="136" stroke="#e7e8ec"/><circle cx="45" cy="84" r="12" fill="#eef1fd"/><text x="45" y="88.5" font-size="11.5" fill="#3451e0" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">1</text><text x="70" y="89" font-size="15" fill="#0b1220" font-weight="600">Work commits on the dev server through gates</text><text x="70" y="110" font-size="13.5" fill="#3d4452">typecheck · API drift · sweep contract. Fail = no commit, error posted</text><text x="70" y="129" font-size="13.5" fill="#3d4452">to the issue. Edits refused until an issue is claimed.</text><line x1="45" y1="182" x2="45" y2="220" stroke="#e7e8ec"/><circle cx="45" cy="168" r="12" fill="#eef1fd"/><text x="45" y="172.5" font-size="11.5" fill="#3451e0" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">2</text><text x="70" y="173" font-size="15" fill="#0b1220" font-weight="600">The dev server cannot push to GitHub</text><text x="70" y="194" font-size="13.5" fill="#3d4452">No token, no helper, no gh. git push denied in settings.</text><line x1="45" y1="247" x2="45" y2="285" stroke="#e7e8ec"/><circle cx="45" cy="233" r="12" fill="#eef1fd"/><text x="45" y="237.5" font-size="11.5" fill="#3451e0" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">3</text><text x="70" y="238" font-size="15" fill="#0b1220" font-weight="600">Server → laptop only when I ask</text><text x="70" y="259" font-size="13.5" fill="#3d4452">No cron, no watcher, no timer.</text><line x1="45" y1="312" x2="45" y2="350" stroke="#e7e8ec"/><circle cx="45" cy="298" r="12" fill="#eef1fd"/><text x="45" y="302.5" font-size="11.5" fill="#3451e0" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">4</text><text x="70" y="303" font-size="15" fill="#0b1220" font-weight="600">Laptop → GitHub on one dev branch</text><text x="70" y="324" font-size="13.5" fill="#3d4452">Branch hardcoded in the publisher; protected branches refused</text><text x="70" y="343" font-size="13.5" fill="#3d4452">server-side.</text><line x1="45" y1="396" x2="45" y2="434" stroke="#e7e8ec"/><circle cx="45" cy="382" r="12" fill="#eef1fd"/><text x="45" y="386.5" font-size="11.5" fill="#3451e0" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">5</text><text x="70" y="387" font-size="15" fill="#0b1220" font-weight="600">The owner merges when I say</text><text x="70" y="408" font-size="13.5" fill="#3d4452">main is read-only to the whole system.</text><circle cx="45" cy="447" r="12" fill="#eef1fd"/><text x="45" y="451.5" font-size="11.5" fill="#3451e0" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">6</text><text x="70" y="452" font-size="15" fill="#0b1220" font-weight="600">No credentials ever reach GitHub</text><text x="70" y="473" font-size="13.5" fill="#3d4452">A content-scanning guard aborts on JWTs, live keys, tokens, private</text><text x="70" y="492" font-size="13.5" fill="#3d4452">keys.</text><rect x="630" y="72" width="538" height="184" rx="10" fill="#fafafb" stroke="#e7e8ec"/><text x="648" y="100" font-size="12" fill="#3451e0" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">laptop</text><text x="712" y="100" font-size="12" fill="#3d4452" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">open the right workspace</text><text x="648" y="122" font-size="12" fill="#3451e0" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">agent</text><text x="712" y="122" font-size="12" fill="#3d4452" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">claim an issue        → edits unlock</text><text x="712" y="144" font-size="12" fill="#3d4452" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">build → run → observe  screenshots, curls</text><text x="712" y="166" font-size="12" fill="#3d4452" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">commit through gates  → fail blocks + logs</text><text x="648" y="188" font-size="12" fill="#3451e0" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">me</text><text x="712" y="188" font-size="12" fill="#3d4452" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">publish from laptop   → guard first, read back</text><text x="712" y="210" font-size="12" fill="#3d4452" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">deploy                → pull-based, /health</text><text x="712" y="232" font-size="12" fill="#3d4452" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">say when to merge     → main stays the owner's</text><text x="630" y="278" font-size="13.5" fill="#0b1220" font-weight="600">Review gates by deliverable</text><rect x="630" y="292" width="538" height="170" rx="10" fill="#fff" stroke="#e7e8ec"/><text x="646" y="314" font-size="13.5" fill="#3d4452">Schemas, migrations, architecture</text><text x="1152" y="314" font-size="12" fill="#0b1220" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="end">cto</text><line x1="630" y1="326" x2="1168" y2="326" stroke="#eef0f3"/><text x="646" y="348" font-size="13.5" fill="#3d4452">UI implementation</text><text x="1152" y="348" font-size="12" fill="#0b1220" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="end">design-system-engineer</text><line x1="630" y1="360" x2="1168" y2="360" stroke="#eef0f3"/><text x="646" y="382" font-size="13.5" fill="#3d4452">AI / prompt changes</text><text x="1152" y="382" font-size="12" fill="#0b1220" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="end">ai-eval-engineer</text><line x1="630" y1="394" x2="1168" y2="394" stroke="#eef0f3"/><text x="646" y="416" font-size="13.5" fill="#3d4452">Bug fixes</text><text x="1152" y="416" font-size="12" fill="#0b1220" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="end">regression-tester</text><line x1="630" y1="428" x2="1168" y2="428" stroke="#eef0f3"/><text x="646" y="450" font-size="13.5" fill="#3d4452">Releases</text><text x="1152" y="450" font-size="12" fill="#0b1220" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="end">engineering-manager + qa</text></svg>