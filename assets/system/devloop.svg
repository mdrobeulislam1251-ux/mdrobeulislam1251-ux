<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="346" viewBox="0 0 1200 346" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-label="The dev loop and its six guarantees"><defs>
  <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
  <linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1222"/><stop offset="1" stop-color="#070b16"/></linearGradient>
  <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.16"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
  <clipPath id="avatar"><circle cx="0" cy="0" r="1"/></clipPath>
  <style>
    .pulse { animation: p 2.2s ease-out infinite; } @keyframes p { 0% { opacity: .7; r: 6px; } 100% { opacity: 0; r: 16px; } }
    .row { opacity: 0; animation: in .5s ease forwards; } @keyframes in { to { opacity: 1; } }
    .blink { animation: b 1.1s steps(1) infinite; } @keyframes b { 50% { opacity: 0; } }
  </style>
</defs><rect x="1" y="1" width="1198" height="344" rx="20" fill="url(#bgg)" stroke="#1e2a44" stroke-width="2"/><rect x="40" y="30" width="364" height="136" rx="14" fill="#0f172a" stroke="#1e2a44"/><text x="62" y="66" font-size="12" fill="#a78bfa" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" letter-spacing="1.5">GUARANTEE 1</text><text x="62" y="94" font-size="17" fill="#e6ecf8" font-weight="800">Commits only through gates</text><text x="62" y="120" font-size="13.5" fill="#8b9ab8">typecheck · API drift · sweep contract. Fail</text><text x="62" y="140" font-size="13.5" fill="#8b9ab8">= no commit, error posted to the issue.</text><rect x="418" y="30" width="364" height="136" rx="14" fill="#0f172a" stroke="#1e2a44"/><text x="440" y="66" font-size="12" fill="#a78bfa" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" letter-spacing="1.5">GUARANTEE 2</text><text x="440" y="94" font-size="17" fill="#e6ecf8" font-weight="800">The dev server cannot push</text><text x="440" y="120" font-size="13.5" fill="#8b9ab8">No token, no helper, no gh. git push denied</text><text x="440" y="140" font-size="13.5" fill="#8b9ab8">in settings.</text><rect x="796" y="30" width="364" height="136" rx="14" fill="#0f172a" stroke="#1e2a44"/><text x="818" y="66" font-size="12" fill="#a78bfa" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" letter-spacing="1.5">GUARANTEE 3</text><text x="818" y="94" font-size="17" fill="#e6ecf8" font-weight="800">Server → laptop only on request</text><text x="818" y="120" font-size="13.5" fill="#8b9ab8">No cron, no watcher, no timer.</text><rect x="40" y="180" width="364" height="136" rx="14" fill="#0f172a" stroke="#1e2a44"/><text x="62" y="216" font-size="12" fill="#a78bfa" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" letter-spacing="1.5">GUARANTEE 4</text><text x="62" y="244" font-size="17" fill="#e6ecf8" font-weight="800">Laptop → GitHub on one branch</text><text x="62" y="270" font-size="13.5" fill="#8b9ab8">Branch hardcoded in the publisher; protected</text><text x="62" y="290" font-size="13.5" fill="#8b9ab8">branches refused.</text><rect x="418" y="180" width="364" height="136" rx="14" fill="#0f172a" stroke="#1e2a44"/><text x="440" y="216" font-size="12" fill="#a78bfa" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" letter-spacing="1.5">GUARANTEE 5</text><text x="440" y="244" font-size="17" fill="#e6ecf8" font-weight="800">The owner merges</text><text x="440" y="270" font-size="13.5" fill="#8b9ab8">main is read-only to the whole system.</text><rect x="796" y="180" width="364" height="136" rx="14" fill="#0f172a" stroke="#1e2a44"/><text x="818" y="216" font-size="12" fill="#a78bfa" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" letter-spacing="1.5">GUARANTEE 6</text><text x="818" y="244" font-size="17" fill="#e6ecf8" font-weight="800">No credentials reach GitHub</text><text x="818" y="270" font-size="13.5" fill="#8b9ab8">A content-scanning guard aborts on JWTs,</text><text x="818" y="290" font-size="13.5" fill="#8b9ab8">keys and tokens.</text></svg>