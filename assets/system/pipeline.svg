<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="272" viewBox="0 0 1200 272" font-family="Geist, Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="The pipeline: ICP in, verified leads out"><defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0ba5d8"/><stop offset=".5" stop-color="#3451e0"/><stop offset="1" stop-color="#7a4bf0"/></linearGradient>
  <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2eaf6"/><stop offset=".6" stop-color="#edf0fb"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  <radialGradient id="cloud"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0b1220" flood-opacity=".12"/></filter>
  <filter id="sh2" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b1220" flood-opacity=".06"/></filter>
  <style>
    .pulse { animation: p 2.2s ease-out infinite; } @keyframes p { 0% { opacity: .55; r: 4px; } 100% { opacity: 0; r: 11px; } }
    .row { opacity: 0; animation: in .5s ease forwards; } @keyframes in { to { opacity: 1; } }
  </style>
</defs><rect x=".5" y=".5" width="1199" height="271" rx="16" fill="#ffffff" stroke="#e7e8ec"/><line x1="66" y1="52" x2="192.28571428571428" y2="52" stroke="#e7e8ec" stroke-width="1.5"/><circle cx="50" cy="52" r="15" fill="#eef1fd"/><text x="50" y="56.5" font-size="12.5" fill="#3451e0" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">1</text><text x="34" y="104" font-size="17.5" fill="#0b1220" font-weight="600" letter-spacing="-0.3">ICP</text><text x="34" y="130" font-size="14" fill="#3d4452">Your brief becomes</text><text x="34" y="151" font-size="14" fill="#3d4452">a precise filter:</text><text x="34" y="172" font-size="14" fill="#3d4452">titles,</text><text x="34" y="193" font-size="14" fill="#3d4452">industries,</text><text x="34" y="214" font-size="14" fill="#3d4452">company size and</text><text x="34" y="235" font-size="14" fill="#3d4452">location.</text><line x1="228.28571428571428" y1="52" x2="354.57142857142856" y2="52" stroke="#e7e8ec" stroke-width="1.5"/><circle cx="212.28571428571428" cy="52" r="15" fill="#eef1fd"/><text x="212.28571428571428" y="56.5" font-size="12.5" fill="#3451e0" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">2</text><text x="196.28571428571428" y="104" font-size="17.5" fill="#0b1220" font-weight="600" letter-spacing="-0.3">Scrape</text><text x="196.28571428571428" y="130" font-size="14" fill="#3d4452">Contacts are</text><text x="196.28571428571428" y="151" font-size="14" fill="#3d4452">pulled from</text><text x="196.28571428571428" y="172" font-size="14" fill="#3d4452">several sources at</text><text x="196.28571428571428" y="193" font-size="14" fill="#3d4452">once and merged</text><text x="196.28571428571428" y="214" font-size="14" fill="#3d4452">into one list.</text><line x1="390.57142857142856" y1="52" x2="516.8571428571429" y2="52" stroke="#e7e8ec" stroke-width="1.5"/><circle cx="374.57142857142856" cy="52" r="15" fill="#eef1fd"/><text x="374.57142857142856" y="56.5" font-size="12.5" fill="#3451e0" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">3</text><text x="358.57142857142856" y="104" font-size="17.5" fill="#0b1220" font-weight="600" letter-spacing="-0.3">Verify</text><text x="358.57142857142856" y="130" font-size="14" fill="#3d4452">Every email is</text><text x="358.57142857142856" y="151" font-size="14" fill="#3d4452">checked by more</text><text x="358.57142857142856" y="172" font-size="14" fill="#3d4452">than one provider</text><text x="358.57142857142856" y="193" font-size="14" fill="#3d4452">before anyone</text><text x="358.57142857142856" y="214" font-size="14" fill="#3d4452">sends to it.</text><line x1="552.8571428571429" y1="52" x2="679.1428571428571" y2="52" stroke="#e7e8ec" stroke-width="1.5"/><circle cx="536.8571428571429" cy="52" r="15" fill="#eef1fd"/><text x="536.8571428571429" y="56.5" font-size="12.5" fill="#3451e0" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">4</text><text x="520.8571428571429" y="104" font-size="17.5" fill="#0b1220" font-weight="600" letter-spacing="-0.3">Dedupe</text><text x="520.8571428571429" y="130" font-size="14" fill="#3d4452">Bad addresses,</text><text x="520.8571428571429" y="151" font-size="14" fill="#3d4452">duplicates and</text><text x="520.8571428571429" y="172" font-size="14" fill="#3d4452">people you already</text><text x="520.8571428571429" y="193" font-size="14" fill="#3d4452">have are removed.</text><line x1="715.1428571428571" y1="52" x2="841.4285714285713" y2="52" stroke="#e7e8ec" stroke-width="1.5"/><circle cx="699.1428571428571" cy="52" r="15" fill="#eef1fd"/><text x="699.1428571428571" y="56.5" font-size="12.5" fill="#3451e0" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">5</text><text x="683.1428571428571" y="104" font-size="17.5" fill="#0b1220" font-weight="600" letter-spacing="-0.3">Enrich</text><text x="683.1428571428571" y="130" font-size="14" fill="#3d4452">The real</text><text x="683.1428571428571" y="151" font-size="14" fill="#3d4452">decision-maker is</text><text x="683.1428571428571" y="172" font-size="14" fill="#3d4452">found and the</text><text x="683.1428571428571" y="193" font-size="14" fill="#3d4452">missing fields are</text><text x="683.1428571428571" y="214" font-size="14" fill="#3d4452">filled in.</text><line x1="877.4285714285713" y1="52" x2="1003.7142857142856" y2="52" stroke="#e7e8ec" stroke-width="1.5"/><circle cx="861.4285714285713" cy="52" r="15" fill="#eef1fd"/><text x="861.4285714285713" y="56.5" font-size="12.5" fill="#3451e0" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">6</text><text x="845.4285714285713" y="104" font-size="17.5" fill="#0b1220" font-weight="600" letter-spacing="-0.3">Deliver</text><text x="845.4285714285713" y="130" font-size="14" fill="#3d4452">The list lands</text><text x="845.4285714285713" y="151" font-size="14" fill="#3d4452">where you work:</text><text x="845.4285714285713" y="172" font-size="14" fill="#3d4452">your sending tool,</text><text x="845.4285714285713" y="193" font-size="14" fill="#3d4452">your CRM or a</text><text x="845.4285714285713" y="214" font-size="14" fill="#3d4452">clean file.</text><circle cx="1023.7142857142857" cy="52" r="15" fill="#ecfdf3"/><text x="1023.7142857142857" y="56.5" font-size="12.5" fill="#15803d" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">7</text><text x="1007.7142857142857" y="104" font-size="17.5" fill="#0b1220" font-weight="600" letter-spacing="-0.3">Campaign</text><text x="1007.7142857142857" y="130" font-size="14" fill="#3d4452">Sequences go out</text><text x="1007.7142857142857" y="151" font-size="14" fill="#3d4452">from your own</text><text x="1007.7142857142857" y="172" font-size="14" fill="#3d4452">mailboxes, and</text><text x="1007.7142857142857" y="193" font-size="14" fill="#3d4452">replies turn into</text><text x="1007.7142857142857" y="214" font-size="14" fill="#3d4452">meetings.</text></svg>