<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" font-family="Geist, Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="The pipeline: ICP in, verified leads out"><defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0ba5d8"/><stop offset=".5" stop-color="#3451e0"/><stop offset="1" stop-color="#7a4bf0"/></linearGradient>
  <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2eaf6"/><stop offset=".6" stop-color="#edf0fb"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  <radialGradient id="cloud"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0b1220" flood-opacity=".12"/></filter>
  <filter id="sh2" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b1220" flood-opacity=".06"/></filter>
  <style>
    .pulse { animation: p 2.2s ease-out infinite; } @keyframes p { 0% { opacity: .55; r: 4px; } 100% { opacity: 0; r: 11px; } }
    .row { opacity: 0; animation: in .5s ease forwards; } @keyframes in { to { opacity: 1; } }
  </style>
</defs><rect x=".5" y=".5" width="1199" height="249" rx="16" fill="#ffffff" stroke="#e7e8ec"/><line x1="66" y1="52" x2="219.33333333333334" y2="52" stroke="#e7e8ec" stroke-width="1.5"/><circle cx="50" cy="52" r="15" fill="#eef1fd"/><text x="50" y="56.5" font-size="12.5" fill="#3451e0" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">1</text><text x="34" y="104" font-size="17.5" fill="#0b1220" font-weight="600" letter-spacing="-0.3">ICP</text><text x="34" y="130" font-size="14" fill="#3d4452">Customer targeting</text><text x="34" y="151" font-size="14" fill="#3d4452">rules become a query:</text><text x="34" y="172" font-size="14" fill="#3d4452">titles, industries,</text><text x="34" y="193" font-size="14" fill="#3d4452">size, geo.</text><line x1="255.33333333333334" y1="52" x2="408.6666666666667" y2="52" stroke="#e7e8ec" stroke-width="1.5"/><circle cx="239.33333333333334" cy="52" r="15" fill="#eef1fd"/><text x="239.33333333333334" y="56.5" font-size="12.5" fill="#3451e0" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">2</text><text x="223.33333333333334" y="104" font-size="17.5" fill="#0b1220" font-weight="600" letter-spacing="-0.3">Extract</text><text x="223.33333333333334" y="130" font-size="14" fill="#3d4452">Apollo sessions pulled</text><text x="223.33333333333334" y="151" font-size="14" fill="#3d4452">through the</text><text x="223.33333333333334" y="172" font-size="14" fill="#3d4452">orchestrator, split</text><text x="223.33333333333334" y="193" font-size="14" fill="#3d4452">into parallel jobs.</text><line x1="444.6666666666667" y1="52" x2="598" y2="52" stroke="#e7e8ec" stroke-width="1.5"/><circle cx="428.6666666666667" cy="52" r="15" fill="#eef1fd"/><text x="428.6666666666667" y="56.5" font-size="12.5" fill="#3451e0" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">3</text><text x="412.6666666666667" y="104" font-size="17.5" fill="#0b1220" font-weight="600" letter-spacing="-0.3">Waterfall verify</text><text x="412.6666666666667" y="130" font-size="14" fill="#3d4452">Several providers in</text><text x="412.6666666666667" y="151" font-size="14" fill="#3d4452">sequence. The source</text><text x="412.6666666666667" y="172" font-size="14" fill="#3d4452">is stored on every</text><text x="412.6666666666667" y="193" font-size="14" fill="#3d4452">record.</text><line x1="634" y1="52" x2="787.3333333333334" y2="52" stroke="#e7e8ec" stroke-width="1.5"/><circle cx="618" cy="52" r="15" fill="#eef1fd"/><text x="618" y="56.5" font-size="12.5" fill="#3451e0" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">4</text><text x="602" y="104" font-size="17.5" fill="#0b1220" font-weight="600" letter-spacing="-0.3">Resolve</text><text x="602" y="130" font-size="14" fill="#3d4452">Find the actual</text><text x="602" y="151" font-size="14" fill="#3d4452">decision-maker, not</text><text x="602" y="172" font-size="14" fill="#3d4452">just any contact at</text><text x="602" y="193" font-size="14" fill="#3d4452">the company.</text><line x1="823.3333333333334" y1="52" x2="976.6666666666667" y2="52" stroke="#e7e8ec" stroke-width="1.5"/><circle cx="807.3333333333334" cy="52" r="15" fill="#eef1fd"/><text x="807.3333333333334" y="56.5" font-size="12.5" fill="#3451e0" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">5</text><text x="791.3333333333334" y="104" font-size="17.5" fill="#0b1220" font-weight="600" letter-spacing="-0.3">Dedupe</text><text x="791.3333333333334" y="130" font-size="14" fill="#3d4452">Checked against every</text><text x="791.3333333333334" y="151" font-size="14" fill="#3d4452">past delivery,</text><text x="791.3333333333334" y="172" font-size="14" fill="#3d4452">normalised to one</text><text x="791.3333333333334" y="193" font-size="14" fill="#3d4452">schema.</text><circle cx="996.6666666666667" cy="52" r="15" fill="#ecfdf3"/><text x="996.6666666666667" y="56.5" font-size="12.5" fill="#15803d" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">6</text><text x="980.6666666666667" y="104" font-size="17.5" fill="#0b1220" font-weight="600" letter-spacing="-0.3">Deliver</text><text x="980.6666666666667" y="130" font-size="14" fill="#3d4452">Webhook or API into</text><text x="980.6666666666667" y="151" font-size="14" fill="#3d4452">Smartlead, Instantly</text><text x="980.6666666666667" y="172" font-size="14" fill="#3d4452">or the customer's CRM.</text></svg>