monospace">03</text><text x="436" y="130" font-size="18" fill="#e6ecf8" font-weight="800">Waterfall verify</text><text x="436" y="160" font-size="13.5" fill="#8b9ab8">Several providers</text><text x="436" y="180" font-size="13.5" fill="#8b9ab8">in sequence. The</text><text x="436" y="200" font-size="13.5" fill="#8b9ab8">source is stored on</text><text x="436" y="220" font-size="13.5" fill="#8b9ab8">every record.</text><text x="600" y="132" font-size="22" fill="#5b6b88" text-anchor="middle">›</text><rect x="607" y="68" width="175" height="196" rx="14" fill="#0f172a" stroke="#1e2a44"/><text x="625" y="100" font-size="13" fill="#38bdf8" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">04</text><text x="625" y="130" font-size="18" fill="#e6ecf8" font-weight="800">Resolve</text><text x="625" y="160" font-size="13.5" fill="#8b9ab8">Find the actual</text><text x="625" y="180" font-size="13.5" fill="#8b9ab8">decision-maker, not</text><text x="625" y="200" font-size="13.5" fill="#8b9ab8">just any contact at</text><text x="625" y="220" font-size="13.5" fill="#8b9ab8">the company.</text><text x="789" y="132" font-size="22" fill="#5b6b88" text-anchor="middle">›</text><rect x="796" y="68" width="175" height="196" rx="14" fill="#0f172a" stroke="#1e2a44"/><text x="814" y="100" font-size="13" fill="#38bdf8" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">05</text><text x="814" y="130" font-size="18" fill="#e6ecf8" font-weight="800">Dedupe</text><text x="814" y="160" font-size="13.5" fill="#8b9ab8">Checked against</text><text x="814" y="180" font-size="13.5" fill="#8b9ab8">every past</text><text x="814" y="200" font-size="13.5" fill="#8b9ab8">delivery,</text><text x="814" y="220" font-size="13.5" fill="#8b9ab8">normalised to one</text><text x="814" y="240" font-size="13.5" fill="#8b9ab8">schema.</text><text x="978" y="132" font-size="22" fill="#5b6b88" text-anchor="middle">›</text><rect x="985" y="68" width="175" height="196" rx="14" fill="#0f172a" stroke="#34d399"/><text x="1003" y="100" font-size="13" fill="#34d399" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">06</text><text x="1003" y="130" font-size="18" fill="#e6ecf8" font-weight="800">Deliver</text><text x="1003" y="160" font-size="13.5" fill="#8b9ab8">Webhook or API into</text><text x="1003" y="180" font-size="13.5" fill="#8b9ab8">Smartlead,</text><text x="1003" y="200" font-size="13.5" fill="#8b9ab8">Instantly or the</text><text x="1003" y="220" font-size="13.5" fill="#8b9ab8">customer's CRM.</text></svg>