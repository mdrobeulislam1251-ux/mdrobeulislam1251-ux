<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1052" viewBox="0 0 1200 1052" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-label="Doctrine: six words, then the kill switches"><defs>
  <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
  <linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1222"/><stop offset="1" stop-color="#070b16"/></linearGradient>
  <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.16"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
  <clipPath id="avatar"><circle cx="0" cy="0" r="1"/></clipPath>
  <style>
    .pulse { animation: p 2.2s ease-out infinite; } @keyframes p { 0% { opacity: .7; r: 6px; } 100% { opacity: 0; r: 16px; } }
    .row { opacity: 0; animation: in .5s ease forwards; } @keyframes in { to { opacity: 1; } }
    .blink { animation: b 1.1s steps(1) infinite; } @keyframes b { 50% { opacity: 0; } }
  </style>
</defs><rect x="1" y="1" width="1198" height="1050" rx="20" fill="url(#bgg)" stroke="#1e2a44" stroke-width="2"/><rect x="40" y="34" width="97" height="38" rx="10" fill="#0f172a" stroke="#1e2a44"/><text x="88.5" y="58" font-size="14" fill="#38bdf8" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">NO GUESS</text><rect x="147" y="34" width="97" height="38" rx="10" fill="#0f172a" stroke="#1e2a44"/><text x="195.5" y="58" font-size="14" fill="#38bdf8" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">NO TRUST</text><rect x="254" y="34" width="122" height="38" rx="10" fill="#0f172a" stroke="#1e2a44"/><text x="315" y="58" font-size="14" fill="#38bdf8" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">GREEN CHECK</text><rect x="386" y="34" width="122" height="38" rx="10" fill="#0f172a" stroke="#1e2a44"/><text x="447" y="58" font-size="14" fill="#38bdf8" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">STOP ON RED</text><rect x="518" y="34" width="114" height="38" rx="10" fill="#0f172a" stroke="#1e2a44"/><text x="575" y="58" font-size="14" fill="#38bdf8" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">IDEMPOTENT</text><rect x="642" y="34" width="131" height="38" rx="10" fill="#0f172a" stroke="#1e2a44"/><text x="707.5" y="58" font-size="14" fill="#38bdf8" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">NO FAKE DONE</text><rect x="40" y="96" width="364" height="168" rx="14" fill="#0f172a" stroke="#1e2a44"/><text x="384" y="166" font-size="64" fill="#1e2a44" font-weight="800" text-anchor="end">1</text><text x="62" y="136" font-size="18" fill="#e6ecf8" font-weight="800">Stop at the endpoint</text><text x="62" y="172" font-size="14" fill="#8b9ab8">count ≠ pull ≠ deliver. fix ≠ commit ≠</text><text x="62" y="192" font-size="14" fill="#8b9ab8">push. Do the named step, then stop.</text><rect x="418" y="96" width="364" height="168" rx="14" fill="#0f172a" stroke="#1e2a44"/><text x="762" y="166" font-size="64" fill="#1e2a44" font-weight="800" text-anchor="end">2</text><text x="440" y="136" font-size="18" fill="#e6ecf8" font-weight="800">Was this action named?</text><text x="440" y="172" font-size="14" fill="#8b9ab8">A request is the approval for that request,</text><text x="440" y="192" font-size="14" fill="#8b9ab8">and nothing adjacent to it.</text><rect x="796" y="96" width="364" height="168" rx="14" fill="#0f172a" stroke="#1e2a44"/><text x="1140" y="166" font-size="64" fill="#1e2a44" font-weight="800" text-anchor="end">3</text><text x="818" y="136" font-size="18" fill="#e6ecf8" font-weight="800">No auto-spend</text><text x="818" y="172" font-size="14" fill="#8b9ab8">No credits, no paid API calls, no purchases</text><text x="818" y="192" font-size="14" fill="#8b9ab8">without a named go.</text><rect x="40" y="278" width="364" height="168" rx="14" fill="#0f172a" stroke="#1e2a44"/><text x="384" y="348" font-size="64" fill="#1e2a44" font-weight="800" text-anchor="end">4</text><text x="62" y="318" font-size="18" fill="#e6ecf8" font-weight="800">No client file until</text><text x="62" y="342" font-size="18" fill="#e6ecf8" font-weight="800">approved</text><text x="62" y="378" font-size="14" fill="#8b9ab8">Row count and ICP are approved first. A bad</text><text x="62" y="398" font-size="14" fill="#8b9ab8">list costs more than a late one.</text><rect x="418" y="278" width="364" height="168" rx="14" fill="#0f172a" stroke="#1e2a44"/><text x="762" y="348" font-size="64" fill="#1e2a44" font-weight="800" text-anchor="end">5</text><text x="440" y="318" font-size="18" fill="#e6ecf8" font-weight="800">No paid recommendation</text><text x="440" y="342" font-size="18" fill="#e6ecf8" font-weight="800">without a test</text><text x="440" y="378" font-size="14" fill="#8b9ab8">Prove it on a sample before proposing the</text><text x="440" y="398" font-size="14" fill="#8b9ab8">spend.</text><rect x="796" y="278" width="364" height="168" rx="14" fill="#0f172a" stroke="#1e2a44"/><text x="1140" y="348" font-size="64" fill="#1e2a44" font-weight="800" text-anchor="end">6</text><text x="818" y="318" font-size="18" fill="#e6ecf8" font-weight="800">No identical essays</text><text x="818" y="354" font-size="14" fill="#8b9ab8">A repeated explanation is a sign the work</text><text x="818" y="374" font-size="14" fill="#8b9ab8">is not being done.</text><rect x="40" y="460" width="364" height="168" rx="14" fill="#0f172a" stroke="#1e2a44"/><text x="384" y="530" font-size="64" fill="#1e2a44" font-weight="800" text-anchor="end">7</text><text x="62" y="500" font-size="18" fill="#e6ecf8" font-weight="800">Verify before claim</text><text x="62" y="536" font-size="14" fill="#8b9ab8">&quot;Done&quot; means it ran and was observed</text><text x="62" y="556" font-size="14" fill="#8b9ab8">passing. Exit code 0 means compiled, never</text><text x="62" y="576" font-size="14" fill="#8b9ab8">works.</text><text x="40" y="678" font-size="13" fill="#a78bfa" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" letter-spacing="1.5">LESSONS THAT BECAME RULES</text><rect x="40" y="696" width="1120" height="316" rx="14" fill="#0f172a" stroke="#1e2a44"/><text x="62" y="728" font-size="14.5" fill="#8b9ab8">A test was run against live accounts instead of a sandbox</text><text x="620" y="728" font-size="15" fill="#5b6b88">→</text><text x="650" y="728" font-size="14.5" fill="#e6ecf8" font-weight="700">Never test against production identities</text><line x1="56" y1="744" x2="1144" y2="744" stroke="#1e2a44"/><text x="62" y="772" font-size="14.5" fill="#8b9ab8">A destructive mistake was quietly repaired</text><text x="620" y="772" font-size="15" fill="#5b6b88">→</text><text x="650" y="772" font-size="14.5" fill="#e6ecf8" font-weight="700">Never hide it. Postmortem first, then fix</text><line x1="56" y1="788" x2="1144" y2="788" stroke="#1e2a44"/><text x="62" y="816" font-size="14.5" fill="#8b9ab8">The preferred tool got built instead of the one asked for</text><text x="620" y="816" font-size="15" fill="#5b6b88">→</text><text x="650" y="816" font-size="14.5" fill="#e6ecf8" font-weight="700">Build the named noun, not the preferred one</text><line x1="56" y1="832" x2="1144" y2="832" stroke="#1e2a44"/><text x="62" y="860" font-size="14.5" fill="#8b9ab8">A search cluster was overloaded by an unthrottled batch</text><text x="620" y="860" font-size="15" fill="#5b6b88">→</text><text x="650" y="860" font-size="14.5" fill="#e6ecf8" font-weight="700">Throttle, measure, then scale</text><line x1="56" y1="876" x2="1144" y2="876" stroke="#1e2a44"/><text x="62" y="904" font-size="14.5" fill="#8b9ab8">A process kill took out its own SSH shell</text><text x="620" y="904" font-size="15" fill="#5b6b88">→</text><text x="650" y="904" font-size="14.5" fill="#e6ecf8" font-weight="700">Never cut your own access</text><line x1="56" y1="920" x2="1144" y2="920" stroke="#1e2a44"/><text x="62" y="948" font-size="14.5" fill="#8b9ab8">A session asked to inspect one host changed another</text><text x="620" y="948" font-size="15" fill="#5b6b88">→</text><text x="650" y="948" font-size="14.5" fill="#e6ecf8" font-weight="700">Touch only the host named in the request</text><line x1="56" y1="964" x2="1144" y2="964" stroke="#1e2a44"/><text x="62" y="992" font-size="14.5" fill="#8b9ab8">Sessions ended with plans instead of working config</text><text x="620" y="992" font-size="15" fill="#5b6b88">→</text><text x="650" y="992" font-size="14.5" fill="#e6ecf8" font-weight="700">One small goal, verify from the client side, record, expand</text></svg>