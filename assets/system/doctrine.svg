<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1018" viewBox="0 0 1200 1018" font-family="Geist, Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Doctrine: six words, then the kill switches"><defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0ba5d8"/><stop offset=".5" stop-color="#3451e0"/><stop offset="1" stop-color="#7a4bf0"/></linearGradient>
  <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2eaf6"/><stop offset=".6" stop-color="#edf0fb"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  <radialGradient id="cloud"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0b1220" flood-opacity=".12"/></filter>
  <filter id="sh2" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b1220" flood-opacity=".06"/></filter>
  <style>
    .pulse { animation: p 2.2s ease-out infinite; } @keyframes p { 0% { opacity: .55; r: 4px; } 100% { opacity: 0; r: 11px; } }
    .row { opacity: 0; animation: in .5s ease forwards; } @keyframes in { to { opacity: 1; } }
  </style>
</defs><rect x=".5" y=".5" width="1199" height="1017" rx="16" fill="#ffffff" stroke="#e7e8ec"/><rect x="32" y="30" width="86" height="32" rx="8" fill="#fff" stroke="#e7e8ec"/><text x="75" y="50.5" font-size="12.5" fill="#0b1220" font-weight="500" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">NO GUESS</text><rect x="126" y="30" width="86" height="32" rx="8" fill="#fff" stroke="#e7e8ec"/><text x="169" y="50.5" font-size="12.5" fill="#0b1220" font-weight="500" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">NO TRUST</text><rect x="220" y="30" width="109" height="32" rx="8" fill="#fff" stroke="#e7e8ec"/><text x="274.5" y="50.5" font-size="12.5" fill="#0b1220" font-weight="500" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">GREEN CHECK</text><rect x="337" y="30" width="109" height="32" rx="8" fill="#fff" stroke="#e7e8ec"/><text x="391.5" y="50.5" font-size="12.5" fill="#0b1220" font-weight="500" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">STOP ON RED</text><rect x="454" y="30" width="101" height="32" rx="8" fill="#fff" stroke="#e7e8ec"/><text x="504.5" y="50.5" font-size="12.5" fill="#0b1220" font-weight="500" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">IDEMPOTENT</text><rect x="563" y="30" width="116" height="32" rx="8" fill="#fff" stroke="#e7e8ec"/><text x="621" y="50.5" font-size="12.5" fill="#0b1220" font-weight="500" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">NO FAKE DONE</text><rect x="32" y="86" width="369.3333333333333" height="168" rx="12" fill="#fff" stroke="#d6d9df" stroke-dasharray="4 3"/><circle cx="67" cy="121" r="13" fill="#eef1fd"/><text x="67" y="125.5" font-size="12" fill="#3451e0" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">1</text><text x="54" y="166" font-size="16.5" fill="#0b1220" font-weight="600">Stop at the endpoint</text><text x="54" y="194" font-size="13.5" fill="#3d4452">count ≠ pull ≠ deliver. fix ≠ commit ≠ push.</text><text x="54" y="214" font-size="13.5" fill="#3d4452">Do the named step, then stop.</text><rect x="415.3333333333333" y="86" width="369.3333333333333" height="168" rx="12" fill="#fff" stroke="#d6d9df" stroke-dasharray="4 3"/><circle cx="450.3333333333333" cy="121" r="13" fill="#eef1fd"/><text x="450.3333333333333" y="125.5" font-size="12" fill="#3451e0" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">2</text><text x="437.3333333333333" y="166" font-size="16.5" fill="#0b1220" font-weight="600">Was this action named?</text><text x="437.3333333333333" y="194" font-size="13.5" fill="#3d4452">A request is the approval for that request,</text><text x="437.3333333333333" y="214" font-size="13.5" fill="#3d4452">and nothing adjacent to it.</text><rect x="798.6666666666666" y="86" width="369.3333333333333" height="168" rx="12" fill="#fff" stroke="#d6d9df" stroke-dasharray="4 3"/><circle cx="833.6666666666666" cy="121" r="13" fill="#eef1fd"/><text x="833.6666666666666" y="125.5" font-size="12" fill="#3451e0" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">3</text><text x="820.6666666666666" y="166" font-size="16.5" fill="#0b1220" font-weight="600">No auto-spend</text><text x="820.6666666666666" y="194" font-size="13.5" fill="#3d4452">No credits, no paid API calls, no purchases</text><text x="820.6666666666666" y="214" font-size="13.5" fill="#3d4452">without a named go.</text><rect x="32" y="268" width="369.3333333333333" height="168" rx="12" fill="#fff" stroke="#d6d9df" stroke-dasharray="4 3"/><circle cx="67" cy="303" r="13" fill="#eef1fd"/><text x="67" y="307.5" font-size="12" fill="#3451e0" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">4</text><text x="54" y="348" font-size="16.5" fill="#0b1220" font-weight="600">No client file until approved</text><text x="54" y="376" font-size="13.5" fill="#3d4452">Row count and ICP are approved first. A bad</text><text x="54" y="396" font-size="13.5" fill="#3d4452">list costs more than a late one.</text><rect x="415.3333333333333" y="268" width="369.3333333333333" height="168" rx="12" fill="#fff" stroke="#d6d9df" stroke-dasharray="4 3"/><circle cx="450.3333333333333" cy="303" r="13" fill="#eef1fd"/><text x="450.3333333333333" y="307.5" font-size="12" fill="#3451e0" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">5</text><text x="437.3333333333333" y="348" font-size="16.5" fill="#0b1220" font-weight="600">No paid recommendation without a</text><text x="437.3333333333333" y="370" font-size="16.5" fill="#0b1220" font-weight="600">test</text><text x="437.3333333333333" y="398" font-size="13.5" fill="#3d4452">Prove it on a sample before proposing the</text><text x="437.3333333333333" y="418" font-size="13.5" fill="#3d4452">spend.</text><rect x="798.6666666666666" y="268" width="369.3333333333333" height="168" rx="12" fill="#fff" stroke="#d6d9df" stroke-dasharray="4 3"/><circle cx="833.6666666666666" cy="303" r="13" fill="#eef1fd"/><text x="833.6666666666666" y="307.5" font-size="12" fill="#3451e0" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">6</text><text x="820.6666666666666" y="348" font-size="16.5" fill="#0b1220" font-weight="600">No identical essays</text><text x="820.6666666666666" y="376" font-size="13.5" fill="#3d4452">A repeated explanation is a sign the work is</text><text x="820.6666666666666" y="396" font-size="13.5" fill="#3d4452">not being done.</text><rect x="32" y="450" width="369.3333333333333" height="168" rx="12" fill="#fff" stroke="#d6d9df" stroke-dasharray="4 3"/><circle cx="67" cy="485" r="13" fill="#eef1fd"/><text x="67" y="489.5" font-size="12" fill="#3451e0" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">7</text><text x="54" y="530" font-size="16.5" fill="#0b1220" font-weight="600">Verify before claim</text><text x="54" y="558" font-size="13.5" fill="#3d4452">&quot;Done&quot; means it ran and was observed passing.</text><text x="54" y="578" font-size="13.5" fill="#3d4452">Exit code 0 means compiled, never works.</text><rect x="32" y="638" width="1136" height="348" rx="12" fill="#fff" stroke="#e7e8ec"/><path d="M32 650 a12 12 0 0 1 12 -12 h1112 a12 12 0 0 1 12 12 v28 h-1136 z" fill="#fafafb"/><line x1="32" y1="678" x2="1168" y2="678" stroke="#e7e8ec"/><text x="52" y="663" font-size="12.5" fill="#6b7280" font-weight="500">Lesson</text><text x="640" y="663" font-size="12.5" fill="#6b7280" font-weight="500">Rule it produced</text><text x="52" y="705" font-size="14" fill="#3d4452">A test was run against live accounts instead of a sandbox</text><path d="M620 700 l4.5 4.5 l9 -9" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="640" y="705" font-size="14" fill="#0b1220" font-weight="600">Never test against production identities</text><line x1="32" y1="722" x2="1168" y2="722" stroke="#eef0f3"/><text x="52" y="749" font-size="14" fill="#3d4452">A destructive mistake was quietly repaired</text><path d="M620 744 l4.5 4.5 l9 -9" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="640" y="749" font-size="14" fill="#0b1220" font-weight="600">Never hide it. Postmortem first, then fix</text><line x1="32" y1="766" x2="1168" y2="766" stroke="#eef0f3"/><text x="52" y="793" font-size="14" fill="#3d4452">The preferred tool got built instead of the one asked for</text><path d="M620 788 l4.5 4.5 l9 -9" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="640" y="793" font-size="14" fill="#0b1220" font-weight="600">Build the named noun, not the preferred one</text><line x1="32" y1="810" x2="1168" y2="810" stroke="#eef0f3"/><text x="52" y="837" font-size="14" fill="#3d4452">A search cluster was overloaded by an unthrottled batch</text><path d="M620 832 l4.5 4.5 l9 -9" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="640" y="837" font-size="14" fill="#0b1220" font-weight="600">Throttle, measure, then scale</text><line x1="32" y1="854" x2="1168" y2="854" stroke="#eef0f3"/><text x="52" y="881" font-size="14" fill="#3d4452">A process kill took out its own SSH shell</text><path d="M620 876 l4.5 4.5 l9 -9" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="640" y="881" font-size="14" fill="#0b1220" font-weight="600">Never cut your own access</text><line x1="32" y1="898" x2="1168" y2="898" stroke="#eef0f3"/><text x="52" y="925" font-size="14" fill="#3d4452">A session asked to inspect one host changed another</text><path d="M620 920 l4.5 4.5 l9 -9" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="640" y="925" font-size="14" fill="#0b1220" font-weight="600">Touch only the host named in the request</text><line x1="32" y1="942" x2="1168" y2="942" stroke="#eef0f3"/><text x="52" y="969" font-size="14" fill="#3d4452">Sessions ended with plans instead of working config</text><path d="M620 964 l4.5 4.5 l9 -9" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="640" y="969" font-size="14" fill="#0b1220" font-weight="600">One small goal, verify from the client side, record, expand</text></svg>