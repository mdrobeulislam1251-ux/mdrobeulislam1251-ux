<svg xmlns="http://www.w3.org/2000/svg" width="590" height="400" viewBox="0 0 590 400" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-label="Case file: Distributed Apollo scraping orchestrator"><defs>
  <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
  <linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1222"/><stop offset="1" stop-color="#070b16"/></linearGradient>
  <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.16"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
  <clipPath id="avatar"><circle cx="0" cy="0" r="1"/></clipPath>
  <style>
    .pulse { animation: p 2.2s ease-out infinite; } @keyframes p { 0% { opacity: .7; r: 6px; } 100% { opacity: 0; r: 16px; } }
    .row { opacity: 0; animation: in .5s ease forwards; } @keyframes in { to { opacity: 1; } }
    .blink { animation: b 1.1s steps(1) infinite; } @keyframes b { 50% { opacity: 0; } }
  </style>
</defs><rect x="1" y="1" width="588" height="398" rx="20" fill="url(#bgg)" stroke="#1e2a44" stroke-width="2"/><text x="30" y="46" font-size="13" fill="#a78bfa" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" letter-spacing="1.5">CHAPTER 01</text><rect x="514" y="26" width="48" height="48" rx="12" fill="#111c33" stroke="#1e2a44"/><image href="data:image/png;base64," x="522" y="34" width="32" height="32"/><text x="30" y="88" font-size="24" fill="#e6ecf8" font-weight="800">Distributed Apollo scraping</text><text x="30" y="118" font-size="24" fill="#e6ecf8" font-weight="800">orchestrator</text><text x="30" y="154" font-size="14" fill="#8b9ab8">Trusted Leads · 2025</text><rect x="192.4" y="137" width="53" height="28.5" rx="14.25" fill="#111c33" stroke="#1e2a44"/><text x="218.9" y="153.5" font-size="12.5" fill="#38bdf8" text-anchor="middle">Data</text><text x="30" y="188" font-size="11.5" fill="#38bdf8" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" letter-spacing="1.5">THE PROBLEM</text><text x="30" y="212" font-size="15.5" fill="#e6ecf8">Large orders against a pool of authenticated sessions: sessions</text><text x="30" y="235" font-size="15.5" fill="#e6ecf8">expire, accounts get flagged, and one big job can stall the</text><text x="30" y="258" font-size="15.5" fill="#e6ecf8">whole queue.</text><rect x="30" y="282" width="530" height="88" rx="12" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-opacity=".35"/><text x="48" y="306" font-size="11.5" fill="#34d399" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" letter-spacing="1.5">THE PROOF</text><text x="48" y="328" font-size="14.5" fill="#e6ecf8">Job state lives in versioned PostgreSQL tables, so every order</text><text x="48" y="349" font-size="14.5" fill="#e6ecf8">has an auditable record from intake to delivery.</text></svg>