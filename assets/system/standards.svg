<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="414" viewBox="0 0 1200 414" font-family="Geist, Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Standards: what you can hold me to"><defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0ba5d8"/><stop offset=".5" stop-color="#3451e0"/><stop offset="1" stop-color="#7a4bf0"/></linearGradient>
  <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2eaf6"/><stop offset=".6" stop-color="#edf0fb"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  <radialGradient id="cloud"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0b1220" flood-opacity=".12"/></filter>
  <filter id="sh2" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b1220" flood-opacity=".06"/></filter>
  <style>
    .pulse { animation: p 2.2s ease-out infinite; } @keyframes p { 0% { opacity: .55; r: 4px; } 100% { opacity: 0; r: 11px; } }
    .row { opacity: 0; animation: in .5s ease forwards; } @keyframes in { to { opacity: 1; } }
  </style>
</defs><rect x=".5" y=".5" width="1199" height="413" rx="16" fill="#ffffff" stroke="#e7e8ec"/><rect x="32" y="28" width="369.3333333333333" height="172" rx="12" fill="#fff" stroke="#d6d9df" stroke-dasharray="4 3"/><circle cx="67" cy="63" r="13" fill="#ecfdf3"/><path d="M61 63 l4.5 4.5 l9 -9" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="108" font-size="16.5" fill="#0b1220" font-weight="600">Verified before it ships</text><text x="54" y="136" font-size="13.5" fill="#3d4452">Every email is checked by more than one</text><text x="54" y="156" font-size="13.5" fill="#3d4452">provider. Nothing unverified reaches your</text><text x="54" y="176" font-size="13.5" fill="#3d4452">sending tool.</text><rect x="415.3333333333333" y="28" width="369.3333333333333" height="172" rx="12" fill="#fff" stroke="#d6d9df" stroke-dasharray="4 3"/><circle cx="450.3333333333333" cy="63" r="13" fill="#ecfdf3"/><path d="M444.3333333333333 63 l4.5 4.5 l9 -9" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="437.3333333333333" y="108" font-size="16.5" fill="#0b1220" font-weight="600">Approved before delivery</text><text x="437.3333333333333" y="136" font-size="13.5" fill="#3d4452">You sign off on the row count and the ICP</text><text x="437.3333333333333" y="156" font-size="13.5" fill="#3d4452">before a single file is sent.</text><rect x="798.6666666666666" y="28" width="369.3333333333333" height="172" rx="12" fill="#fff" stroke="#d6d9df" stroke-dasharray="4 3"/><circle cx="833.6666666666666" cy="63" r="13" fill="#ecfdf3"/><path d="M827.6666666666666 63 l4.5 4.5 l9 -9" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="820.6666666666666" y="108" font-size="16.5" fill="#0b1220" font-weight="600">No spend without your go</text><text x="820.6666666666666" y="136" font-size="13.5" fill="#3d4452">No paid credits, tools or API calls are used</text><text x="820.6666666666666" y="156" font-size="13.5" fill="#3d4452">on your behalf without a clear yes.</text><rect x="32" y="214" width="369.3333333333333" height="172" rx="12" fill="#fff" stroke="#d6d9df" stroke-dasharray="4 3"/><circle cx="67" cy="249" r="13" fill="#ecfdf3"/><path d="M61 249 l4.5 4.5 l9 -9" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="294" font-size="16.5" fill="#0b1220" font-weight="600">Proof, not promises</text><text x="54" y="322" font-size="13.5" fill="#3d4452">Every row keeps its source, and you get</text><text x="54" y="342" font-size="13.5" fill="#3d4452">samples to check the work yourself.</text><rect x="415.3333333333333" y="214" width="369.3333333333333" height="172" rx="12" fill="#fff" stroke="#d6d9df" stroke-dasharray="4 3"/><circle cx="450.3333333333333" cy="249" r="13" fill="#ecfdf3"/><path d="M444.3333333333333 249 l4.5 4.5 l9 -9" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="437.3333333333333" y="294" font-size="16.5" fill="#0b1220" font-weight="600">Private by default</text><text x="437.3333333333333" y="322" font-size="13.5" fill="#3d4452">Your lists are built and stored on private</text><text x="437.3333333333333" y="342" font-size="13.5" fill="#3d4452">infrastructure, not public tools.</text><rect x="798.6666666666666" y="214" width="369.3333333333333" height="172" rx="12" fill="#fff" stroke="#d6d9df" stroke-dasharray="4 3"/><circle cx="833.6666666666666" cy="249" r="13" fill="#ecfdf3"/><path d="M827.6666666666666 249 l4.5 4.5 l9 -9" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="820.6666666666666" y="294" font-size="16.5" fill="#0b1220" font-weight="600">Fixed at the source</text><text x="820.6666666666666" y="322" font-size="13.5" fill="#3d4452">When a campaign underperforms, I find the</text><text x="820.6666666666666" y="342" font-size="13.5" fill="#3d4452">cause and fix it upstream so it does not</text><text x="820.6666666666666" y="362" font-size="13.5" fill="#3d4452">repeat.</text></svg>