<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="181" viewBox="0 0 1200 181" font-family="Geist, Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="The pipeline: ICP in, verified leads out"><defs>
