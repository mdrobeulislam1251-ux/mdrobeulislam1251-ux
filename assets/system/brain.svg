<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="338" viewBox="0 0 1200 338" font-family="Geist, Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="The second brain"><defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0ba5d8"/><stop offset=".5" stop-color="#3451e0"/><stop offset="1" stop-color="#7a4bf0"/></linearGradient>
  <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2eaf6"/><stop offset=".6" stop-color="#edf0fb"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  <radialGradient id="cloud"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0b1220" flood-opacity=".12"/></filter>
  <filter id="sh2" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b1220" flood-opacity=".06"/></filter>
  <style>
    .pulse { animation: p 2.2s ease-out infinite; } @keyframes p { 0% { opacity: .55; r: 4px; } 100% { opacity: 0; r: 11px; } }
    .row { opacity: 0; animation: in .5s ease forwards; } @keyframes in { to { opacity: 1; } }
  </style>
</defs><rect x=".5" y=".5" width="1199" height="337" rx="16" fill="#ffffff" stroke="#e7e8ec"/><rect x="32" y="28" width="1136" height="92" rx="12" fill="#fff" stroke="#e7e8ec"/><text x="54" y="72" font-size="28" fill="#0b1220" font-weight="600" letter-spacing="-0.8">541</text><text x="54" y="98" font-size="13" fill="#6b7280">curated notes</text><line x1="259.2" y1="28" x2="259.2" y2="120" stroke="#e7e8ec"/><text x="281.2" y="72" font-size="28" fill="#0b1220" font-weight="600" letter-spacing="-0.8">3,141</text><text x="281.2" y="98" font-size="13" fill="#6b7280">archived session logs</text><line x1="486.4" y1="28" x2="486.4" y2="120" stroke="#e7e8ec"/><text x="508.4" y="72" font-size="28" fill="#0b1220" font-weight="600" letter-spacing="-0.8">571</text><text x="508.4" y="98" font-size="13" fill="#6b7280">sessions audited</text><line x1="713.5999999999999" y1="28" x2="713.5999999999999" y2="120" stroke="#e7e8ec"/><text x="735.5999999999999" y="72" font-size="28" fill="#0b1220" font-weight="600" letter-spacing="-0.8">7</text><text x="735.5999999999999" y="98" font-size="13" fill="#6b7280">kill switches</text><line x1="940.8" y1="28" x2="940.8" y2="120" stroke="#e7e8ec"/><text x="962.8" y="72" font-size="28" fill="#0b1220" font-weight="600" letter-spacing="-0.8">53 / 44</text><text x="962.8" y="98" font-size="13" fill="#6b7280">agents / doctrine skills</text><path d="M34 155 l4.5 4.5 l9 -9" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="160" font-size="16" fill="#0b1220" font-weight="600">Live beats notes.</text><text x="58" y="184" font-size="14" fill="#3d4452">A wrong fact in the brain is worse than no fact. Every fact carries</text><text x="58" y="205" font-size="14" fill="#3d4452">the command that proved it, and the date.</text><path d="M618 155 l4.5 4.5 l9 -9" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="642" y="160" font-size="16" fill="#0b1220" font-weight="600">Decisions, not diaries.</text><text x="642" y="184" font-size="14" fill="#3d4452">Git records the doing. The brain records the why, and what was tried</text><text x="642" y="205" font-size="14" fill="#3d4452">and rejected.</text><path d="M34 239 l4.5 4.5 l9 -9" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="244" font-size="16" fill="#0b1220" font-weight="600">An emotion governor, not feelings.</text><text x="58" y="268" font-size="14" fill="#3d4452">A prompt hook classifies each message as Frustrated, Correction,</text><text x="58" y="289" font-size="14" fill="#3d4452">Build, Ask or Focus. Frustration means stop, load state, then act.</text><path d="M618 239 l4.5 4.5 l9 -9" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="642" y="244" font-size="16" fill="#0b1220" font-weight="600">Per-project brains.</text><text x="642" y="268" font-size="14" fill="#3d4452">Boundaries, verified state and a verification recipe, loaded at</text><text x="642" y="289" font-size="14" fill="#3d4452">session start.</text></svg>