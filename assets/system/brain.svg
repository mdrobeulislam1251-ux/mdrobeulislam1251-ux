<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="368" viewBox="0 0 1200 368" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-label="The second brain"><defs>
  <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
  <linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1222"/><stop offset="1" stop-color="#070b16"/></linearGradient>
  <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.16"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
  <clipPath id="avatar"><circle cx="0" cy="0" r="1"/></clipPath>
  <style>
    .pulse { animation: p 2.2s ease-out infinite; } @keyframes p { 0% { opacity: .7; r: 6px; } 100% { opacity: 0; r: 16px; } }
    .row { opacity: 0; animation: in .5s ease forwards; } @keyframes in { to { opacity: 1; } }
    .blink { animation: b 1.1s steps(1) infinite; } @keyframes b { 50% { opacity: 0; } }
  </style>
</defs><rect x="1" y="1" width="1198" height="366" rx="20" fill="url(#bgg)" stroke="#1e2a44" stroke-width="2"/><rect x="40" y="30" width="214.4" height="90" rx="14" fill="#0f172a" stroke="#1e2a44"/><text x="60" y="72" font-size="30" fill="#e6ecf8" font-weight="800">541</text><text x="60" y="98" font-size="13.5" fill="#8b9ab8">curated notes</text><rect x="266.4" y="30" width="214.4" height="90" rx="14" fill="#0f172a" stroke="#1e2a44"/><text x="286.4" y="72" font-size="30" fill="#e6ecf8" font-weight="800">3,141</text><text x="286.4" y="98" font-size="13.5" fill="#8b9ab8">archived session logs</text><rect x="492.8" y="30" width="214.4" height="90" rx="14" fill="#0f172a" stroke="#1e2a44"/><text x="512.8" y="72" font-size="30" fill="#e6ecf8" font-weight="800">571</text><text x="512.8" y="98" font-size="13.5" fill="#8b9ab8">sessions audited</text><rect x="719.2" y="30" width="214.4" height="90" rx="14" fill="#0f172a" stroke="#1e2a44"/><text x="739.2" y="72" font-size="30" fill="#e6ecf8" font-weight="800">7</text><text x="739.2" y="98" font-size="13.5" fill="#8b9ab8">kill switches</text><rect x="945.6" y="30" width="214.4" height="90" rx="14" fill="#0f172a" stroke="#1e2a44"/><text x="965.6" y="72" font-size="30" fill="#e6ecf8" font-weight="800">53 / 44</text><text x="965.6" y="98" font-size="13.5" fill="#8b9ab8">agents / doctrine skills</text><rect x="40" y="140" width="553" height="90" rx="14" fill="#0f172a" stroke="#1e2a44"/><path d="M62 172 l5 5 l10 -10" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="178" font-size="17" fill="#e6ecf8" font-weight="800">Live beats notes.</text><text x="90" y="204" font-size="14" fill="#8b9ab8">Every fact carries the command that proved it, and the date.</text><rect x="607" y="140" width="553" height="90" rx="14" fill="#0f172a" stroke="#1e2a44"/><path d="M629 172 l5 5 l10 -10" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="657" y="178" font-size="17" fill="#e6ecf8" font-weight="800">Decisions, not diaries.</text><text x="657" y="204" font-size="14" fill="#8b9ab8">Git records the doing. The brain records the why and what was</text><text x="657" y="224" font-size="14" fill="#8b9ab8">rejected.</text><rect x="40" y="244" width="553" height="90" rx="14" fill="#0f172a" stroke="#1e2a44"/><path d="M62 276 l5 5 l10 -10" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="282" font-size="17" fill="#e6ecf8" font-weight="800">An emotion governor.</text><text x="90" y="308" font-size="14" fill="#8b9ab8">Each message is classified (Frustrated, Correction, Build, Ask,</text><text x="90" y="328" font-size="14" fill="#8b9ab8">Focus) and the agent adapts.</text><rect x="607" y="244" width="553" height="90" rx="14" fill="#0f172a" stroke="#1e2a44"/><path d="M629 276 l5 5 l10 -10" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="657" y="282" font-size="17" fill="#e6ecf8" font-weight="800">Per-project brains.</text><text x="657" y="308" font-size="14" fill="#8b9ab8">Boundaries, verified state and a verification recipe, loaded at</text><text x="657" y="328" font-size="14" fill="#8b9ab8">session start.</text></svg>