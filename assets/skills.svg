<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bar" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#3D7DFF"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A78BFA" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <style>
      .lbl { fill: #c9d1d9; font-size: 16px; font-weight: 600; }
      .sub { fill: #8b949e; font-size: 12px; }
      .pct { fill: #a78bfa; font-size: 14px; font-weight: 700; opacity: 0; animation: fade 0.6s ease-out forwards; }
      .ttl { fill: #e6edf3; font-size: 22px; font-weight: 700; }
      .shine { animation: sweep 2.8s linear infinite; }
      @keyframes fade { to { opacity: 1; } }
      @keyframes sweep { from { transform: translateX(-200px); } to { transform: translateX(900px); } }
      .pct:nth-of-type(1){animation-delay:1.1s}.pct:nth-of-type(2){animation-delay:1.3s}.pct:nth-of-type(3){animation-delay:1.5s}
      .pct:nth-of-type(4){animation-delay:1.7s}.pct:nth-of-type(5){animation-delay:1.9s}.pct:nth-of-type(6){animation-delay:2.1s}
    </style>
  </defs>
  <rect width="900" height="400" rx="16" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="899" height="399" rx="16" fill="none" stroke="#30363d"/>
  <text x="32" y="44" class="ttl">Skills</text>
  <text x="32" y="66" class="sub">Six tracks from the CV. Depth measured in shipped systems, not years.</text>

  <g transform="translate(32,96)">
    <text class="lbl" y="14">AI &amp; Agents</text>
    <text class="sub" y="32">Claude Agent SDK · Claude Code · MCP · enforcement hooks · vLLM / Qwen</text>
    <rect x="330" y="4" width="500" height="18" rx="9" fill="#161b22"/>
    <rect x="330" y="4" width="0" height="18" rx="9" fill="url(#bar)">
      <animate attributeName="width" from="0" to="475" dur="1.1s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
  </g>
  <g transform="translate(32,146)">
    <text class="lbl" y="14">Data</text>
    <text class="sub" y="32">Python · PostgreSQL · Supabase · ETL/ELT · scraping at scale · waterfall verification</text>
    <rect x="330" y="4" width="500" height="18" rx="9" fill="#161b22"/>
    <rect x="330" y="4" width="0" height="18" rx="9" fill="url(#bar)">
      <animate attributeName="width" from="0" to="460" dur="1.1s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
  </g>
  <g transform="translate(32,196)">
    <text class="lbl" y="14">Automation &amp; APIs</text>
    <text class="sub" y="32">n8n multi-workflow systems · REST/RPC · webhooks · FastAPI · KrakenD · Authgear</text>
    <rect x="330" y="4" width="500" height="18" rx="9" fill="#161b22"/>
    <rect x="330" y="4" width="0" height="18" rx="9" fill="url(#bar)">
      <animate attributeName="width" from="0" to="450" dur="1.1s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
  </g>
  <g transform="translate(32,246)">
    <text class="lbl" y="14">GTM Systems</text>
    <text class="sub" y="32">Apollo.io · ICP design · MillionVerifier / Reacher · deliverability · Smartlead · Instantly</text>
    <rect x="330" y="4" width="500" height="18" rx="9" fill="#161b22"/>
    <rect x="330" y="4" width="0" height="18" rx="9" fill="url(#bar)">
      <animate attributeName="width" from="0" to="440" dur="1.1s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
  </g>
  <g transform="translate(32,296)">
    <text class="lbl" y="14">Infrastructure</text>
    <text class="sub" y="32">Docker · Ubuntu · Coolify · Tailscale · Cloudflare Tunnels · Caddy · AWS SES · KVM</text>
    <rect x="330" y="4" width="500" height="18" rx="9" fill="#161b22"/>
    <rect x="330" y="4" width="0" height="18" rx="9" fill="url(#bar)">
      <animate attributeName="width" from="0" to="450" dur="1.1s" begin="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
  </g>
  <g transform="translate(32,346)">
    <text class="lbl" y="14">Languages</text>
    <text class="sub" y="32">Python · TypeScript · JavaScript · SQL · Bash · Next.js · React · Node.js</text>
    <rect x="330" y="4" width="500" height="18" rx="9" fill="#161b22"/>
    <rect x="330" y="4" width="0" height="18" rx="9" fill="url(#bar)">
      <animate attributeName="width" from="0" to="425" dur="1.1s" begin="1.1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
  </g>

  <g>
    <text class="pct" x="845" y="114">95</text>
    <text class="pct" x="845" y="164">92</text>
    <text class="pct" x="845" y="214">90</text>
    <text class="pct" x="845" y="264">88</text>
    <text class="pct" x="845" y="314">90</text>
    <text class="pct" x="845" y="364">85</text>
  </g>

  <g>
    <rect class="shine" x="0" y="0" width="200" height="400" fill="url(#glow)" opacity="0.08"/>
  </g>
</svg>
