<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1a1033"/>
      <stop offset="0.5" stop-color="#101a3a"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#3D7DFF"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.5" stop-color="#3D7DFF"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="130" rx="18"/></clipPath>
    <style>
      .q { font-size: 15px; font-weight: 600; fill: #c9d1d9; letter-spacing: .3px; }
      .s { font-size: 12px; fill: #8b949e; }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="130" fill="url(#bg)"/>
    <rect width="1200" height="130" fill="url(#grid)"/>
    <path fill="url(#w1)" opacity="0.5">
      <animate attributeName="d" dur="14s" repeatCount="indefinite" calcMode="spline"
        keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"
        values="M0 0 L1200 0 L1200 40 C 1000 70, 800 10, 600 45 S 200 80, 0 35 Z;
                M0 0 L1200 0 L1200 60 C 1000 30, 800 70, 600 25 S 200 20, 0 60 Z;
                M0 0 L1200 0 L1200 40 C 1000 70, 800 10, 600 45 S 200 80, 0 35 Z"/>
    </path>
    <path fill="url(#w2)" opacity="0.4">
      <animate attributeName="d" dur="11s" repeatCount="indefinite" calcMode="spline"
        keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"
        values="M0 0 L1200 0 L1200 25 C 950 5, 750 55, 550 20 S 150 15, 0 50 Z;
                M0 0 L1200 0 L1200 50 C 950 45, 750 10, 550 40 S 150 55, 0 15 Z;
                M0 0 L1200 0 L1200 25 C 950 5, 750 55, 550 20 S 150 15, 0 50 Z"/>
    </path>
    <text class="q" x="600" y="92" text-anchor="middle">"Status 200 ≠ correct work."<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.182;1" dur="1.1s" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1"/></text>
    <text class="s" x="600" y="112" text-anchor="middle">Verified before done. Every claim is "ran it", "read it", or marked unverified.<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.357;1" dur="1.4s" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1"/></text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="129" rx="18" fill="none" stroke="#30363d"/>
</svg>
